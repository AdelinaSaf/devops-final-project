file.upload-dir=/Users/pro/IdeaProjects/culinaryExchangeS2/CulinaryService/uploads

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/culinaryExchangeS2
spring.datasource.username=postgres
spring.datasource.password=123

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Security
spring.security.user.name=admin
spring.security.user.password=adminpass
spring.security.user.roles=ADMIN

# Server
server.port=8080
server.servlet.context-path=/culinary

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.flyway.validate-on-migrate=true

logging.level.root=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.security=DEBUG

logging.file.name=logs/culinary-exchange.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

pdf.service.url=${PDF_SERVICE_URL:http://localhost:5050/generate-pdf}

